<!DOCTYPE html>
<html lang="en" class="auth-document">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11110f">
    <title>Create an account | T:10 Watches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="watch-store.css">
</head>
<body class="auth-page">
    <header class="site-header"><a class="wordmark" href="/" aria-label="T:10 Watches home"><span>T:10</span><small>WATCHES</small></a><a class="header-admin-link" href="/login.html">Log in <span aria-hidden="true">↗</span></a></header>
    <main class="auth-shell">
        <a class="auth-brand" href="/" aria-label="T:10 Watches home"><strong>T:10</strong><span>WATCHES</span></a>
        <p class="eyebrow">T:10 WATCHES</p><h1>Create an account</h1><p class="auth-lead">Set up your account to continue.</p>
        <form class="auth-form" id="signup-form">
            <label for="signup-username">Name</label><input id="signup-username" name="username" type="text" autocomplete="name" required>
            <label for="signup-email">Email address</label><input id="signup-email" name="email" type="email" autocomplete="email" maxlength="254" required>
            <label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" required>
            <p class="form-message" id="signup-message" role="status" aria-live="polite"></p>
            <button class="button button-dark" type="submit">Create account <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-switch">Already registered? <a href="/login.html">Log in</a></p>
        <a class="auth-back" href="/">Back to T:10 Watches</a>
    </main>
    <script src="auth.js"></script>
</body>
</html>
