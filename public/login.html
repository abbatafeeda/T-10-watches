<!DOCTYPE html>
<html lang="en" class="auth-document">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11110f">
    <title>Admin sign in | T:10 Watches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="watch-store.css">
</head>
<body class="auth-page">
    <header class="site-header"><a class="wordmark" href="/" aria-label="T:10 Watches home"><span>T:10</span><small>WATCHES</small></a><a class="header-admin-link" href="/shop.html">Shop collection <span aria-hidden="true">↗</span></a></header>
    <main class="auth-shell">
        <a class="auth-brand" href="/" aria-label="T:10 Watches home"><strong>T:10</strong><span>WATCHES</span></a>
        <p class="eyebrow">WELCOME BACK.</p><h1>Sign in to your account.</h1><p class="auth-lead">Sign in to manage the T:10 collection.</p>
        <form class="auth-form" id="login-form">
            <label for="login-email">Email address</label><input id="login-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            <label for="login-password">Password</label><input id="login-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
            <button class="button button-dark" type="submit">Sign in <span aria-hidden="true">→</span></button>
        </form>
        <p class="auth-switch">Need an account? <a href="/signup.html">Create one</a></p>
        <a class="auth-back" href="/">Back to T:10 Watches</a>
    </main>
    <script src="auth.js"></script>
</body>
</html>
