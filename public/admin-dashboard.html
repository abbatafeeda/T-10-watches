<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#11110f">
    <title>Collection manager | T:10 Watches</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="watch-store.css">
    <script src="watches-manager.js" defer></script>
</head>
<body class="admin-page">
    <header class="site-header admin-header">
        <a class="wordmark" href="/" aria-label="T:10 Watches home"><span>T:10</span><small>WATCHES</small></a>
        <div class="admin-header-actions"><span class="admin-indicator"><i aria-hidden="true"></i> ADMIN</span><button class="text-button" id="logout-button" type="button">Sign out <span aria-hidden="true">↗</span></button></div>
    </header>
    <main class="admin-main">
        <section class="admin-welcome"><div><p class="eyebrow eyebrow-gold">T:10 WATCHES / ADMIN</p><h1>Your collection</h1><p>Manage the timepieces currently on the shop floor.</p></div><button class="button button-gold" id="open-watch-dialog" type="button"><span aria-hidden="true">+</span> Add a watch</button></section>
        <section class="admin-summary" aria-label="Collection summary"><div><span class="summary-label">TOTAL TIMEPIECES</span><strong id="watch-count">—</strong></div><div><span class="summary-label">AVAILABLE</span><strong id="available-count">—</strong></div><p class="admin-message" id="dashboard-message" role="status" aria-live="polite"></p></section>
        <section class="admin-inventory" aria-labelledby="inventory-title"><div class="admin-table-heading"><div><p class="eyebrow">INVENTORY</p><h2 id="inventory-title">All watches</h2></div><a class="text-link" href="/shop.html" target="_blank" rel="noreferrer">View storefront <span aria-hidden="true">↗</span></a></div><div class="admin-watch-list" id="watch-list" aria-live="polite" aria-busy="true"></div></section>
    </main>

    <dialog class="watch-dialog" id="watch-dialog" aria-labelledby="watch-dialog-title">
        <form id="watch-form" enctype="multipart/form-data">
            <div class="dialog-heading"><div><p class="eyebrow eyebrow-gold">COLLECTION DETAILS</p><h2 id="watch-dialog-title">Add a watch</h2></div><button class="dialog-close" id="close-watch-dialog" type="button" aria-label="Close dialog">×</button></div>
            <div class="watch-form-grid">
                <div class="form-field"><label for="watch-name">Watch name</label><input id="watch-name" name="name" maxlength="120" required></div>
                <div class="form-field"><label for="watch-brand">Brand</label><input id="watch-brand" name="brand" maxlength="80" required></div>
                <div class="form-field"><label for="watch-price">Price (NGN)</label><input id="watch-price" name="price" type="number" min="0.01" step="0.01" inputmode="decimal" required></div>
                <div class="form-field"><label for="watch-colour">Colour</label><input id="watch-colour" name="colour" maxlength="60" required></div>
                <div class="form-field"><label for="watch-availability">Availability</label><select id="watch-availability" name="availability"><option>Available</option><option>Sold out</option></select></div>
                <div class="form-field"><label for="watch-image">Product image</label><input id="watch-image" name="watch_image" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"><small>JPG, PNG, or WEBP. Up to 5 MB.</small></div>
                <div class="form-field form-field-wide"><label for="watch-description">Description</label><textarea id="watch-description" name="description" maxlength="2000" rows="4" required></textarea></div>
            </div>
            <p class="form-message" id="watch-form-message" role="status" aria-live="polite"></p>
            <div class="dialog-actions"><button class="button button-outline" id="cancel-watch" type="button">Cancel</button><button class="button button-dark" id="save-watch" type="submit">Save watch</button></div>
        </form>
    </dialog>
</body>
</html>
